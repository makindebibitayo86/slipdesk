<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --wine:#6d1f2e;--wine-dk:#5e1927;--wine-bk:#120509;--gold:#c4962a;--gold-hi:#f6dc8c;--gold-lt:#e2b84d;
  --ink:#1c1216;--mute:#6b4a54;--line:#e6d9dc;--paper:#faf6f4;--card:#fff;--ok:#2f7d4f;
  --serif:'Crimson Pro',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar, same family as the Slip Desk nav */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100% - 1300px)/2));background:linear-gradient(180deg,#7a2638,#6d1f2e 55%,var(--wine-dk));border-bottom:3px solid var(--gold);color:#fff}
.bar h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.01em}
.bar h1 small{font-family:var(--sans);font-size:12px;font-weight:500;opacity:.75;margin-left:10px;letter-spacing:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pghead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin:0 0 16px}
.pghead h1{margin:0;font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--wine)}
.pghead span{font-size:13px;color:var(--mute)}
.load{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);cursor:pointer;font-weight:600;transition:background .2s}
.load:hover{background:rgba(255,255,255,.2)}
.load input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

html,body{height:auto}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1 0 auto;min-height:auto;width:100%;max-width:1240px;margin:0 auto;padding:22px 28px 60px}

/* empty / drop state */
.drop{margin:40px auto;max-width:560px;padding:44px 24px;text-align:center;border:2px dashed #cdb3b9;border-radius:18px;color:var(--mute);background:#fff;transition:border-color .2s,background .2s}
.drop b{display:block;font-family:var(--serif);font-size:24px;color:var(--wine);margin-bottom:6px}
.drop.over{border-color:var(--gold);background:#fffaf0}
.drop .err{color:#b3261e;font-weight:600;margin-top:10px}

/* overall figures */
.overall{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);border-radius:18px;overflow:hidden;background:var(--wine-bk);color:#fff;box-shadow:0 14px 30px -14px rgba(18,5,9,.7),inset 0 1px 0 rgba(255,238,190,.2);border:1px solid rgba(226,184,77,.5)}
.ov{padding:24px 28px;position:relative;display:flex;flex-direction:column;justify-content:center}
.ov .shr{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.ov .shr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold-lt),var(--gold-hi))}
.ov .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ov .chips span{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid rgba(226,184,77,.35);background:rgba(255,255,255,.06);color:#f1e6d0}
.ov .chips b{color:var(--gold-hi);font-weight:700}
.ov+.ov{border-left:1px solid rgba(226,184,77,.28)}
.ov .n{display:block;font-family:var(--serif);font-weight:700;font-size:54px;line-height:1;font-variant-numeric:lining-nums tabular-nums;background:linear-gradient(180deg,#fff6d4,var(--gold-hi) 28%,var(--gold-lt) 62%,#b48620);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov.main .n{font-size:68px}
.ov .l{display:block;margin-top:8px;font-weight:600;font-size:13px;color:#f1e6d0}
.ov .s{display:block;font-size:12px;color:#c9b8a8;margin-top:2px}
.note{margin:12px 2px 0;color:var(--mute);font-size:12.5px}
.note b{color:var(--ink)}

h2{font-family:var(--serif);font-size:24px;margin:34px 0 4px;color:var(--wine)}
.sub{margin:0 0 12px;color:var(--mute);font-size:13px}

/* subject ledger */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;white-space:nowrap}
thead th{font-size:12px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);background:#fcf9f8;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ledger tbody tr{border-bottom:1px solid #f0e7e9}
.ledger tbody tr:last-child{border-bottom:0}
.ledger .sj{font-weight:600;white-space:normal;min-width:240px}
.ledger .sj small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.cellbtn{all:unset;cursor:pointer;display:inline-block;min-width:64px;padding:3px 10px;border-radius:8px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.cellbtn:hover{background:#f6e9ec;color:var(--wine)}
.cellbtn:focus-visible{outline:2px solid var(--gold)}
.cellbtn.on{background:var(--wine);color:#fff}
.cellbtn[disabled]{cursor:default;color:#b9a6ac;font-weight:500}
.cellbtn[disabled]:hover{background:none;color:#b9a6ac}
.track{width:220px}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;background:#efe5e7}
.split i{display:block;height:100%}
.split .a{background:var(--wine)}.split .b{background:var(--gold-lt)}
.key{display:flex;gap:16px;margin:0 0 10px;font-size:12.5px;color:var(--mute)}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.key .a::before{background:var(--wine)}.key .b::before{background:var(--gold-lt)}

.ledger th small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.ledger th.grp{text-align:center}
.ledger .gl{border-left:1px solid #f0e7e9}
.alnk{all:unset;cursor:pointer;color:var(--wine);font-weight:700;text-decoration:underline}
.alnk:focus-visible{outline:2px solid var(--gold)}

/* records */
#recs{scroll-margin-top:12px}
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:34px}
.rhead h2{margin:0}
.tools{display:flex;flex-wrap:nowrap;justify-content:space-between;flex:1 1 100%;gap:12px;align-items:center}
.tools .seg,.tools .tact{flex:0 0 auto}
.tools .seg button,.tools .btn{white-space:nowrap}
.tools .seg button{padding:5px 11px}
.tools .btn{padding:8px 12px}
.tools .tact{display:flex;gap:8px}
@media(max-width:1180px){.tools{gap:8px}.tools .seg button{padding:5px 8px;font-size:12.5px}.tools .btn{padding:7px 10px;font-size:13px}.tools .tact{gap:6px}}
@media(max-width:980px){.tools{flex-wrap:wrap}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button:focus-visible{outline:2px solid var(--gold)}
.seg button.on{background:var(--wine);color:#fff}
.q{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:220px}
.btn{cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--wine);background:var(--wine);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--wine)}
.btn:disabled{opacity:.45;cursor:default}
.rec tbody tr{cursor:pointer;border-bottom:1px solid #f0e7e9}
.rec tbody tr:hover{background:#fbf3f4}
.rec td.nm{font-weight:600;white-space:normal;min-width:200px}
.ctag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.ctag.ms{background:#f6e9ec;color:var(--wine)}.ctag.lg{background:#faf0d4;color:#7a5a0c}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mute);font-size:13px}
.pager div{display:flex;gap:6px}
.empty{padding:28px;text-align:center;color:var(--mute)}

/* record sheet */
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(18,5,9,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--wine);color:#fff;border-bottom:3px solid var(--gold)}
.dh b{font-family:var(--serif);font-size:20px}
.dh button{all:unset;cursor:pointer;padding:4px 10px;border-radius:8px;font-weight:600}
.dh button:hover{background:rgba(255,255,255,.15)}
.dh button:focus-visible{outline:2px solid var(--gold-hi)}
.db{max-height:70vh;overflow:auto;padding:6px 18px 16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:7px 0;border-bottom:1px solid #f0e7e9}
.kv span{color:var(--mute);font-size:12.5px}.kv b{font-weight:500;word-break:break-word}
.kv a{color:var(--wine)}

@media(max-width:820px){
  .overall{grid-template-columns:1fr}
  .ov+.ov{border-left:0;border-top:1px solid rgba(226,184,77,.28)}
  .ov.main .n{font-size:56px}
  .bar h1 small{display:none}
  .kv{grid-template-columns:1fr}
}

/* attendance sheet preview (mirrors the sample PDF) */
#pv{display:none}
body.pv-open nav,body.pv-open footer,body.pv-open .navdim,body.pv-open main,body.pv-open dialog{display:none}
body.pv-open #pv{display:block}
.pvbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(16px,calc((100% - 1300px)/2));background:var(--wine);border-bottom:3px solid var(--gold);color:#fff}
.pvbar .t{flex:1;min-width:200px;font-weight:600}
.pvbar .t small{display:block;font-weight:400;opacity:.8;font-size:12px}
.pvbar .btn{background:#fff;color:var(--wine);border-color:#fff}
.pvbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.pg{background:#fff;width:210mm;max-width:calc(100% - 24px);margin:18px auto;padding:12mm;box-shadow:0 10px 30px -14px rgba(18,5,9,.5);overflow-x:auto;color:#1a1a1a}
.pgh{display:flex;align-items:center;gap:16px;padding-bottom:10px;border-bottom:3px solid var(--wine);margin-bottom:10px}
.pgh img{height:62px;width:auto}
.pgh .tt{text-align:center;flex:1}
.pgh .tt small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.22em;color:var(--wine);text-transform:uppercase}
.pgh .tt b{display:block;font-family:var(--serif);font-size:22px;color:#1a1a1a;margin:2px 0}
.info{display:grid;grid-template-columns:1fr 1.5fr 1fr;border-top:1px solid var(--wine);border-left:1px solid var(--wine);margin-bottom:12px}
.info div{padding:6px 10px;border-right:1px solid var(--wine);border-bottom:1px solid var(--wine);min-height:44px}
.info .full{grid-column:1/-1}.info .s2{grid-column:span 2}
.info span,.ft span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--wine);text-transform:uppercase}
.info b,.ft b{display:block;font-size:15px;font-weight:600}
table.att{width:100%;border-collapse:collapse;font-size:13px}
.att th,.att td{border:1px solid #7b3a46;padding:0 10px;height:11mm;white-space:normal;text-align:left;vertical-align:middle}
.att thead th{position:static;background:#f3e9eb;color:#1a1a1a;font-size:12.5px;height:9mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.att td.sn{text-align:center;width:11mm;color:#555}
.att th.sn{text-align:center}
.att .sg{width:26%}.att .sc{width:15%}
.ft{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--wine);border-left:1px solid var(--wine);margin-top:14px;break-inside:avoid}
.ft div{padding:6px 10px;border-right:1px solid var(--wine);border-bottom:1px solid var(--wine);min-height:42px}
.ft .two{grid-column:span 2}
@media print{
  @page{size:A4;margin:10mm}
  body.pv-open{background:#fff}
  .pvbar{display:none}
  .pg{box-shadow:none;margin:0;padding:0;width:auto;max-width:none;overflow:visible;break-after:page}
  .pg:last-child{break-after:auto}
  .att thead{display:table-header-group}
  .att tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== PRINT = the screen, scaled down to one A4 landscape sheet. Pure CSS: nothing is switched on by script at print time. ===== */
@media print{
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:var(--paper)}
  tr{break-inside:avoid}
  nav,footer,.navdim,#upPanel,#recs,.drop{display:none!important}
}
/* 02-portal.css hides nav and main when printing (it prints slips from inside frames); this page prints its own main */
@media print{
  body:not(.pv-open){display:block;height:auto;min-height:0}
  body:not(.pv-open) main{display:block!important;flex:none;min-height:0;width:1500px;max-width:none;margin:0 auto;padding:0;zoom:.52}
  body:not(.pv-open) .overall{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr)}
  body:not(.pv-open) .ov+.ov{border-left:1px solid rgba(226,184,77,.28);border-top:0}
  body:not(.pv-open) .ov.main .n{font-size:68px}
  body:not(.pv-open) .tw{overflow:visible}
  body:not(.pv-open) thead th{position:static}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n).toLocaleString('en-NG');
  const PAGE = 50;
  const TN = { off: 'Officer candidates', sub: 'Sub-officer candidates', resit: 'Resit candidates' };
  const KL = { off: 'Officer', sub: 'Sub-officer', none: 'No papers' };

  /* ---------- rules ---------- */
  // Confirmed = CONFIRMED or CONFIRMED (MANUAL). Pending, amount-mismatch, council and cancelled rows are left out.
  const isConfirmed = s => /^CONFIRMED/i.test(String(s || '').trim());
  const catOf = s => /local/i.test(String(s || '')) ? 'LG' : 'MS';
  const CAT = { MS: 'Mainstream', LG: 'Local Government' };

  // The same paper is spelled differently for Sub-Officer / Local Government candidates. Merge to one name.
  const subjectKey = raw => {
    const t = String(raw).replace(/\s+/g, ' ').trim();
    const l = t.toLowerCase();
    if (/^public service rules/.test(l)) return 'Public Service Rules (Vol.I)';
    if (/^financial regulations/.test(l)) return 'Financial Regulations (PSR Vol. II)';
    return t;
  };

  // Officers sit 7 papers, Sub-officers sit 5. Any other number of papers makes the candidate a resit,
  // and a resit stays inside Officers or Sub-officers according to their cadre on the register.
  const cadreOf = r => { const t = String(r['Exam Cadre Type'] == null ? '' : r['Exam Cadre Type']).toLowerCase(); return /sub/.test(t) ? 'sub' : /officer|^off/.test(t) ? 'off' : null; };
  const val = (r, k) => { const v = r[k]; return v == null ? '' : v; };
  const nameOf = r => (val(r,'Candidate Name') || [val(r,'Surname'), val(r,'First Name'), val(r,'Other Name')].filter(Boolean).join(' ')).toString().trim();
  const phoneOf = r => { let p = String(val(r,'Phone')).replace(/\D/g, ''); return p.length === 10 ? '0' + p : p; };

  /* ---------- compute ---------- */
  function compute(rows){
    const status = {}, confirmed = [], bySubject = new Map();
    let manual = 0, sittings = 0, mis = 0, zero = 0, dup = 0, guess = 0;
    rows.forEach(r => { const s = String(val(r,'Payment Status')).trim() || '(blank)'; status[s] = (status[s] || 0) + 1; });
    const N = { MS: { all: 0, off: 0, sub: 0, resit: 0 }, LG: { all: 0, off: 0, sub: 0, resit: 0 } };
    const subjCols = rows.length ? Object.keys(rows[0]).filter(k => /^Subject \d+$/i.test(k)).sort((a,b)=>parseInt(a.slice(8))-parseInt(b.slice(8))) : [];
    rows.forEach(r => {
      if (!isConfirmed(val(r,'Payment Status'))) return;
      const cat = catOf(val(r,'Staff Category'));
      const idx = confirmed.length;
      // Papers come from the filled Subject columns, not from "No. of Subjects". Resit = 1 to 4 papers.
      const filled = subjCols.filter(c => String(val(r,c)).trim()).length;
      const decl = String(val(r,'No. of Subjects')).trim();
      const bad = decl === '' || Number(decl) !== filled;
      const resit = filled >= 1 && filled !== 5 && filled !== 7;
      let kind = filled === 7 ? 'off' : filled === 5 ? 'sub' : 'none';
      if (resit) { kind = cadreOf(r); if (!kind) { kind = filled >= 6 ? 'off' : 'sub'; guess++; } }
      confirmed.push({ r, cat, name: nameOf(r), phone: phoneOf(r), papers: filled, decl, kind, resit, off: kind === 'off', sub: kind === 'sub', mis: bad });
      N[cat].all++; if (kind !== 'none') N[cat][kind]++; if (resit) N[cat].resit++;
      if (bad) mis++;
      if (!filled) zero++;
      if (/manual/i.test(val(r,'Payment Status'))) manual++;
      const seen = new Set();
      subjCols.forEach(c => {
        const raw = val(r, c); if (!String(raw).trim()) return;
        const k = subjectKey(raw); if (seen.has(k)) return; seen.add(k);
        let e = bySubject.get(k); if (!e) bySubject.set(k, e = { name: k, raws: new Set(), MS: [], LG: [], RS: { MS: 0, LG: 0 } });
        e.raws.add(String(raw).trim()); e[cat].push(idx); if (kind === 'resit') e.RS[cat]++; sittings++;
      });
      if (seen.size < filled) dup++;
    });
    const subjects = [...bySubject.values()].sort((a,b) => (b.MS.length + b.LG.length) - (a.MS.length + a.LG.length) || a.name.localeCompare(b.name));
    const ms = confirmed.filter(c => c.cat === 'MS').length;
    return { guess, total: rows.length, confirmed, subjects, ms, lg: confirmed.length - ms, manual, sittings, status, N, mis, zero, dup };
  }

  /* ---------- render ---------- */
  let D = null, sel = { subj: null, cat: 'ALL', f: null }, q = '', page = 0, shown = [];

  function render(rows){
    D = compute(rows); sel = { subj: null, cat: 'ALL', f: null }; q = ''; page = 0;
    let h = '<div class="pghead"><h1>Attendances</h1><span>2026 Compulsory Examination · confirmed candidates only</span></div>';
    h += '<section class="overall" aria-label="Overall attendance">' +
      '<div class="ov main"><span class="n">' + fmt(D.confirmed.length) + '</span><span class="l">Overall attendance</span><span class="s">confirmed candidates expected to sit</span>' +
      '<div class="chips"><span><b>' + fmt(D.total) + '</b> registrations</span><span><b>' + fmt(D.sittings) + '</b> papers sat</span></div></div>' +
      '<div class="ov"><span class="n">' + fmt(D.ms) + '</span><span class="l">Mainstream</span><span class="s">' + pct(D.ms, D.confirmed.length) + ' of confirmed</span><div class="shr"><i style="width:' + pct(D.ms, D.confirmed.length) + '"></i></div></div>' +
      '<div class="ov"><span class="n">' + fmt(D.lg) + '</span><span class="l">Local Government staff</span><span class="s">' + pct(D.lg, D.confirmed.length) + ' of confirmed</span><div class="shr"><i style="width:' + pct(D.lg, D.confirmed.length) + '"></i></div></div></section>';
    const N = D.N, T = k => N.MS[k] + N.LG[k];
    const cols = [['all', null, 'All confirmed'], ['off', 'off', 'Officers<small>7 papers</small>'], ['sub', 'sub', 'Sub-officers<small>5 papers</small>'], ['resit', 'resit', 'Resit<small>not 5 or 7 papers</small>']];
    const row = (lab, cat) => '<tr><td class="sj">' + lab + '</td>' + cols.map(([k, f]) => '<td class="num' + (k === 'resit' ? ' gl' : '') + '">' + cellBtn('ALL', cat, cat === 'ALL' ? T(k) : N[cat][k], false, f) + '</td>').join('') + '</tr>';
    const check = (D.mis ? '<b>' + fmt(D.mis) + '</b> confirmed candidate' + (D.mis === 1 ? ' disagrees' : 's disagree') + ' with “No. of Subjects” (blank counts as a disagreement). <button type="button" class="alnk" data-i="ALL" data-c="ALL" data-f="mis">Show them</button>' : 'All confirmed candidates agree with “No. of Subjects”.') +
      (D.zero ? ' ' + fmt(D.zero) + ' with no subject filled are not counted under any type.' : '') +
      (D.guess ? ' ' + fmt(D.guess) + ' resit candidate' + (D.guess === 1 ? ' has' : 's have') + ' no readable cadre on the register, so ' + (D.guess === 1 ? 'was' : 'were') + ' placed by paper count (6 or more: Officers, fewer: Sub-officers).' : '') +
      (D.dup ? ' ' + fmt(D.dup) + ' with the same paper listed twice (counted once in papers sat).' : '');
    h += '<h2>Candidates by type</h2><p class="sub">Officers sit 7 papers and Sub-officers sit 5. Anyone with a different number of papers is a resit. Resit candidates are already inside Officers and Sub-officers, by cadre. Click a number to see the records.</p>' +
      '<div class="tw"><table class="ledger"><thead><tr><th>Category</th>' + cols.map(c => '<th class="num' + (c[0] === 'resit' ? ' gl' : '') + '">' + c[2] + '</th>').join('') + '</tr></thead><tbody>' + row('Mainstream', 'MS') + row('Local Government', 'LG') + '</tbody><tfoot>' + row('Overall total', 'ALL') + '</tfoot></table></div>' +
      '<p class="note">Papers are counted from the filled Subject 1–7 columns. ' + check + '</p>';
    // subject table groups: Mainstream | Local Government | Overall Total, each Officers | Sub-officers | Resit (Overall also has All)
    const kk = [['off', 'off'], ['sub', 'sub'], ['resit', 'resit']];
    const kkAll = [['all', null]];
    const LB = { off: 'Officers<small>7 papers</small>', sub: 'Sub-officers<small>5 papers</small>', resit: 'Resit', all: 'All' };
    const ids = (s, cat) => cat === 'ALL' ? s.MS.concat(s.LG) : s[cat];
    const cnt = (s, cat, f) => f ? ids(s, cat).filter(x => D.confirmed[x][f]).length : ids(s, cat).length;
    const grp = (i, cat, s, set) => set.map(([k, f], j) => '<td class="num' + (j ? '' : ' gl') + '">' + cellBtn(i, cat, cnt(s, cat, f), false, f) + '</td>').join('');
    const hd = set => set.map(([k], j) => '<th class="num' + (j ? '' : ' gl') + '">' + LB[k] + '</th>').join('');
    const sub2 = hd(kk) + hd(kk) + hd(kkAll);

    h += '<h2>Candidates per subject</h2><p class="sub">Click a number to see those candidates’ records.</p>';
    h += '<div class="key"><span class="a">Mainstream</span><span class="b">Local Government</span></div>';
    h += '<div class="tw"><table class="ledger"><thead><tr><th rowspan="2">Subject</th><th class="grp gl" colspan="3">Mainstream</th><th class="grp gl" colspan="3">Local Government</th><th class="grp gl">Overall Total</th></tr><tr>' + sub2 + '</tr></thead><tbody>';
    D.subjects.forEach((s, i) => {
      h += '<tr><td class="sj">' + esc(s.name) + '</td>' +
        grp(i, 'MS', s, kk) + grp(i, 'LG', s, kk) + grp(i, 'ALL', s, kkAll) +
        '</tr>';
    });
    h += '</tbody></table></div>';

    h += '<div id="recs" tabindex="-1"></div>';
    $('view').innerHTML = h; $('view').hidden = false; $('drop').hidden = true;
    $('prt').hidden = false;
  }
  const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '0%';
  const cellBtn = (i, cat, n, strong, f) => n
    ? '<button type="button" class="cellbtn" data-i="' + i + '" data-c="' + cat + '"' + (f ? ' data-f="' + f + '"' : '') + ' aria-label="Show ' + fmt(n) + ' records">' + fmt(n) + '</button>'
    : '<button type="button" class="cellbtn" disabled>0</button>';

  // ids for the current subject and filter (sel.f = 'resit' or 'mis'), in one category
  const ofCat = (cat, f = sel.f) => {
    let ids;
    if (sel.subj === 'ALL') ids = D.confirmed.map((_, i) => i).filter(i => cat === 'ALL' || D.confirmed[i].cat === cat);
    else { const s = D.subjects[sel.subj]; ids = cat === 'MS' ? s.MS : cat === 'LG' ? s.LG : s.MS.concat(s.LG); }
    return f ? ids.filter(i => D.confirmed[i][f]) : ids;
  };
  function list(){
    let out = ofCat(sel.cat).map(i => D.confirmed[i]);
    const t = q.trim().toLowerCase();
    if (t) out = out.filter(c => (c.name + ' ' + val(c.r,'Exam Number') + ' ' + c.phone + ' ' + val(c.r,'Payment Ref') + ' ' + val(c.r,'MDA')).toLowerCase().includes(t));
    return out.sort((a, b) => a.name.localeCompare(b.name));
  }

  function renderRecs(scroll){
    const box = $('recs'); if (sel.subj == null) { box.innerHTML = ''; return; }
    const s = sel.subj === 'ALL' ? null : D.subjects[sel.subj];
    shown = list();
    const pages = Math.max(1, Math.ceil(shown.length / PAGE)); if (page >= pages) page = pages - 1;
    const counts = { MS: ofCat('MS').length, LG: ofCat('LG').length }, mis = sel.f === 'mis';
    const tseg = (f, l) => '<button type="button" data-tp="' + (f || 'all') + '" class="' + (sel.f === f ? 'on' : '') + '">' + l + ' · ' + fmt(ofCat(sel.cat, f).length) + '</button>';
    const types = mis ? '' : '<div class="seg" role="group" aria-label="Type">' + tseg(null, 'All') + tseg('off', 'Officers') + tseg('sub', 'Sub-officers') + tseg('resit', 'Resit') + '</div>';
    const seg = (c, l) => '<button type="button" data-seg="' + c + '" class="' + (sel.cat === c ? 'on' : '') + '">' + l + '</button>';
    let h = '<div class="rhead"><div><h2>' + esc(s ? s.name + (TN[sel.f] ? ' · ' + TN[sel.f].replace(' candidates', '').toLowerCase() : '') : mis ? 'Subject count mismatches' : TN[sel.f] || 'All confirmed candidates') + '</h2><p class="sub" style="margin:0">' + fmt(shown.length) + ' record' + (shown.length === 1 ? '' : 's') + (sel.cat !== 'ALL' ? ' · ' + CAT[sel.cat] : '') + '</p></div>' +
      '<div class="tools">' + '<div class="seg" role="group" aria-label="Category">' + seg('ALL', 'Both · ' + fmt(counts.MS + counts.LG)) + seg('MS', 'Mainstream · ' + fmt(counts.MS)) + seg('LG', 'Local Government · ' + fmt(counts.LG)) + '</div>' + types +
      '' + (s ? '<div class="tact"><button type="button" class="btn" id="xl" title="One overall attendance list for this paper, using the category and type shown">Download Excel</button><button type="button" class="btn ghost" id="pvb" title="Printable overall attendance list for this paper, using the category and type shown">Preview lists</button></div>' : '') + '</div></div>';
    h += '<div class="tw" style="margin-top:12px"><table class="rec"><thead><tr><th class="num">#</th><th>Candidate</th><th>Exam number</th><th>Category</th><th class="num">Papers</th>' + (mis ? '<th class="num">Declared</th>' : '') + '<th>Type</th><th>Gender</th><th>Phone</th><th>Cadre</th><th>MDA</th><th>Zone</th><th>Centre</th><th>Payment</th></tr></thead><tbody>';
    if (!shown.length) h += '<tr><td colspan="' + (mis ? 14 : 13) + '" class="empty">No records match.</td></tr>';
    shown.slice(page * PAGE, page * PAGE + PAGE).forEach((c, k) => {
      const r = c.r;
      h += '<tr data-k="' + (page * PAGE + k) + '" tabindex="0"><td class="num">' + (page * PAGE + k + 1) + '</td><td class="nm">' + esc(c.name) + '</td><td>' + esc(val(r,'Exam Number')) + '</td>' +
        '<td><span class="ctag ' + c.cat.toLowerCase() + '">' + CAT[c.cat] + '</span></td><td class="num">' + c.papers + '</td>' + (mis ? '<td class="num">' + esc(c.decl || '—') + '</td>' : '') + '<td>' + KL[c.kind] + (c.resit ? ' · Resit' : '') + '</td><td>' + esc(val(r,'Gender')) + '</td><td>' + esc(c.phone) + '</td><td>' + esc(val(r,'Exam Cadre Type')) + '</td>' +
        '<td>' + esc(val(r,'MDA')) + '</td><td>' + esc(val(r,'Zone')) + '</td><td>' + esc(val(r,'Centre')) + '</td><td>' + esc(val(r,'Payment Status')) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="pager"><span>Page ' + (page + 1) + ' of ' + fmt(pages) + '</span><div><button type="button" class="btn ghost" data-pg="-1"' + (page ? '' : ' disabled') + '>Previous</button><button type="button" class="btn ghost" data-pg="1"' + (page < pages - 1 ? '' : ' disabled') + '>Next</button></div></div>';
    box.innerHTML = h;
    document.querySelectorAll('.cellbtn').forEach(b => b.classList.toggle('on', String(sel.subj) === b.dataset.i && b.dataset.c === sel.cat && (b.dataset.f || null) === sel.f));
    if (scroll) box.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- record sheet + csv ---------- */
  const serial = n => { const d = new Date(Math.round((n - 25569) * 864e5)); return d.getUTCDate().toString().padStart(2,'0') + '/' + (d.getUTCMonth()+1).toString().padStart(2,'0') + '/' + d.getUTCFullYear(); };
  function show(v, k){
    if (v instanceof Date) return v.getUTCDate().toString().padStart(2,'0') + '/' + (v.getUTCMonth()+1).toString().padStart(2,'0') + '/' + v.getUTCFullYear();
    if (typeof v === 'number' && /date/i.test(k) && v > 30000 && v < 80000) return serial(v);
    if (/^phone$/i.test(k)) return phoneOf({ Phone: v });
    return v;
  }
  function openSheet(c){
    $('shT').textContent = c.name || 'Record';
    let h = '';
    Object.keys(c.r).forEach(k => {
      let v = c.r[k]; if (v === '' || v == null) return;
      const label = (k === '__EMPTY' ? 'Registered' : k), out = show(v, k);
      h += '<div class="kv"><span>' + esc(label) + '</span><b>' + (/^https?:/i.test(out) ? '<a href="' + esc(out) + '" target="_blank" rel="noopener">Open</a>' : esc(out)) + '</b></div>';
    });
    $('shB').innerHTML = h; $('sheet').showModal();
  }
  /* ---------- attendance list: one paper, one overall ordered list for the category + type currently shown ---------- */
  const CAT_SHORT = { MS: 'Mainstream', LG: 'Local Govt' };
  const TYPE_LABEL = { off: 'Officers (incl. resit)', sub: 'Sub-officers (incl. resit)', resit: 'Resit (not 5 or 7 papers)' };
  const CREST = ''; // optional: a data: URI of the state crest, shown top-left on the preview
  const enOf = c => String(val(c.r, 'Exam Number')).trim();

  // Everyone sitting the open paper, in the category and type chosen above the table (the search box is ignored), ordered by exam number.
  function attList(){
    const s = D.subjects[sel.subj];
    const rows = ofCat(sel.cat).map(i => D.confirmed[i]).sort((a, b) => enOf(a).localeCompare(enOf(b), undefined, { numeric: true }) || a.name.localeCompare(b.name));
    return { subj: s.name, rows, cat: sel.cat === 'ALL' ? 'Mainstream & Local Govt' : CAT_SHORT[sel.cat], type: TYPE_LABEL[sel.f] || 'All candidates' };
  }
  const fileStem = a => 'attendance-' + a.subj.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') + (sel.cat === 'ALL' ? '' : '-' + CAT_SHORT[sel.cat].replace(/\s/g, '')) + (sel.f ? '-' + { off: 'Officers', sub: 'SubOfficers', resit: 'Resit' }[sel.f] : '');

  function xlsx(){
    if (sel.subj == null || sel.subj === 'ALL') return;
    if (typeof XLSX === 'undefined') return alert('The Excel writer did not load. Check the internet connection and reload.');
    const a = attList(), n = a.rows.length, f = 10 + n;
    const A = [
      ['OYO STATE CIVIL / PUBLIC SERVICE'], ['2026 Compulsory Confirmation Examination'], ['ATTENDANCE LIST · ' + a.cat.toUpperCase()], [],
      ['Subject / Paper: ' + a.subj],
      ['Category: ' + a.cat, '', 'Type: ' + a.type, 'Candidates: ' + n],
      ['Date:', '', 'Time:'], [],
      ['S/N', 'Candidate Name', 'Exam Number', 'Signature', 'Script No.']
    ].concat(a.rows.map((c, i) => [i + 1, c.name, enOf(c), '', '']), [[],
      ['Present:', '', 'Absent:', 'Total:'],
      ['Invigilator (Name):', '', '', 'Signature:']]);
    const ws = XLSX.utils.aoa_to_sheet(A), m = (r, x, y) => ({ s: { r, c: x }, e: { r, c: y } });
    ws['!cols'] = [{ wch: 6 }, { wch: 36 }, { wch: 30 }, { wch: 26 }, { wch: 14 }];
    ws['!merges'] = [m(0, 0, 4), m(1, 0, 4), m(2, 0, 4), m(4, 0, 4), m(5, 0, 1), m(5, 3, 4), m(6, 0, 1), m(6, 3, 4), m(f, 0, 1), m(f, 3, 4), m(f + 1, 0, 2), m(f + 1, 3, 4)];
    ws['!rows'] = A.map((_, r) => r >= 9 && r < 9 + n ? { hpt: 26 } : r >= f ? { hpt: 24 } : {});
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
    XLSX.writeFile(wb, fileStem(a) + '.xlsx');
  }

  function pvPage(a){
    return '<section class="pg"><div class="pgh">' + (CREST ? '<img src="' + esc(CREST) + '" alt="">' : '') +
      '<div class="tt"><small>Oyo State Civil / Public Service</small><b>2026 Compulsory Confirmation Examination</b><small>Attendance list · ' + esc(a.cat) + '</small></div></div>' +
      '<div class="info"><div class="full"><span>Subject / Paper</span><b>' + esc(a.subj) + '</b></div>' +
      '<div><span>Category</span><b>' + esc(a.cat) + '</b></div><div><span>Type</span><b>' + esc(a.type) + '</b></div><div><span>Candidates</span><b>' + fmt(a.rows.length) + '</b></div>' +
      '<div><span>Date</span><b>&nbsp;</b></div><div class="s2"><span>Time</span><b>&nbsp;</b></div></div>' +
      '<table class="att"><thead><tr><th class="sn">S/N</th><th>Candidate Name</th><th>Exam Number</th><th class="sg">Signature</th><th class="sc">Script No.</th></tr></thead><tbody>' +
      a.rows.map((c, i) => '<tr><td class="sn">' + (i + 1) + '</td><td>' + esc(c.name) + '</td><td>' + esc(enOf(c)) + '</td><td></td><td></td></tr>').join('') +
      '</tbody></table>' +
      '<div class="ft"><div><span>Present</span></div><div><span>Absent</span></div><div><span>Total</span></div><div class="two"><span>Invigilator (name)</span></div><div><span>Signature</span></div></div></section>';
  }
  let pvScroll = 0;
  function openPreview(){
    if (sel.subj == null || sel.subj === 'ALL') return;
    const a = attList(); pvScroll = window.scrollY;
    $('pv').innerHTML = '<div class="pvbar"><button type="button" class="btn ghost" id="pvx">← Back</button>' +
      '<div class="t">' + esc(a.subj) + '<small>' + esc(a.cat) + ' · ' + esc(a.type) + ' · ' + fmt(a.rows.length) + ' candidates</small></div>' +
      '<button type="button" class="btn" id="pvp">Print / Save as PDF</button><button type="button" class="btn ghost" id="xl">Download Excel</button></div>' + pvPage(a);
    document.body.classList.add('pv-open'); window.scrollTo(0, 0);
  }
  function closePreview(){
    document.body.classList.remove('pv-open'); $('pv').innerHTML = ''; window.scrollTo(0, pvScroll);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('.cellbtn,.alnk');
    if (b && !b.disabled) { sel = { subj: b.dataset.i === 'ALL' ? 'ALL' : +b.dataset.i, cat: b.dataset.c, f: b.dataset.f || null }; q = ''; page = 0; renderRecs(true); return; }
    const tp = e.target.closest('[data-tp]'); if (tp) { sel.f = tp.dataset.tp === 'all' ? null : tp.dataset.tp; page = 0; renderRecs(false); return; }
    const sg = e.target.closest('[data-seg]'); if (sg) { sel.cat = sg.dataset.seg; page = 0; renderRecs(false); return; }
    const pg = e.target.closest('[data-pg]'); if (pg && !pg.disabled) { page += +pg.dataset.pg; renderRecs(false); $('recs').scrollIntoView({ block: 'start' }); return; }
    if (e.target.closest('#prt')) { window.print(); return; }
    if (e.target.closest('#xl')) { xlsx(); return; }
    if (e.target.closest('#pvb')) { openPreview(); return; }
    if (e.target.closest('#pvx')) { closePreview(); return; }
    if (e.target.closest('#pvp')) { window.print(); return; }
    const tr = e.target.closest('.rec tbody tr[data-k]'); if (tr) openSheet(shown[+tr.dataset.k]);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('pv-open')) { closePreview(); return; } const tr = e.target.closest && e.target.closest('.rec tbody tr[data-k]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSheet(shown[+tr.dataset.k]); } });
  $('shX').addEventListener('click', () => $('sheet').close());
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').close(); });

  /* ---------- reading the file ---------- */
  function fail(m){ if (D) return; $('err').textContent = m; $('err').hidden = false; $('drop').hidden = false; $('view').hidden = true; }   // a bad file never wipes the register already on screen
  function toRows(wb){
    const name = wb.SheetNames.includes('Applications') ? 'Applications' : wb.SheetNames.find(n => { const ws = wb.Sheets[n]; const j = XLSX.utils.sheet_to_json(ws, { header: 1, range: 0 }); return j[0] && j[0].includes('Exam Number'); });
    if (!name) return null;
    return XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }).filter(r => String(r['Exam Number'] || '').trim());
  }
  // A refresh starts empty: any register copy saved earlier by this page or the main app is wiped when the page opens.
  const IDB_NAME = 'slipdesk', IDB_STORE = 'register';
  const idbOpen = () => new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no indexedDB'));
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const idbDo = (mode, fn) => idbOpen().then(db => new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, mode), q = fn(t.objectStore(IDB_STORE));
    t.oncomplete = () => { db.close(); res(q && q.result); }; t.onerror = t.onabort = () => { db.close(); rej(t.error); };
  }));
  window.clearStoredRegister = () => { idbDo('readwrite', st => st.delete('current')).catch(() => {}); };
  // The navbar's Load register panel and the footer's upload box both call this: readFile(file, { done(rowCount), fail(message) })
  function readFile(file, cb){
    cb = cb || {};
    const bad = m => { if (!cb.restore) fail(m); cb.fail && cb.fail(m); };   // a stored copy that cannot be read fails quietly
    $('err').hidden = true;
    if (!/\.(xlsx|xls|csv)$/i.test(file.name)) return bad('“' + file.name + '” is not a register file. Use .xlsx, .xls or .csv.');
    if (typeof XLSX === 'undefined') return bad('The Excel reader did not load. Check the internet connection and reload.');
    const fr = new FileReader();
    fr.onerror = () => bad('Could not read that file.');
    fr.onload = () => setTimeout(() => {
      try {
        let wb = XLSX.read(fr.result, { type: 'array', cellDates: true, sheets: 'Applications' }), rows = wb.SheetNames.length ? toRows(wb) : null;
        if (!rows) { wb = XLSX.read(fr.result, { type: 'array', cellDates: true }); rows = toRows(wb); }
        if (!rows || !rows.length) return bad('No “Applications” sheet with an Exam Number column was found.');
        render(rows);
        cb.done && cb.done(rows.length);
      } catch (x) { console.error(x); bad('That file could not be opened.'); }
    }, 30);
    fr.readAsArrayBuffer(file);
  }
  window.attendanceLoad = readFile;
  window.attendanceClear = () => { D = null; sel = { subj: null, cat: 'ALL', f: null }; $('view').hidden = true; $('view').innerHTML = ''; $('drop').hidden = false; $('prt').hidden = true; };

  // For Slip Desk: call window.renderAttendance(ROWS) from the Analytics > Attendances view, with ROWS as objects keyed by the sheet headers.
  window.renderAttendance = render;
})();
</script>

<script>
/* ===== Navbar + footer, taken from nav-notch-scratch.html ===== */
/* the signed-in person: the same saved profile the Profile page writes, else the account's defaults */

/* ---- Tab switcher: copied verbatim from js/app.js (your sliding bubble) ---- */
(function () {
  const tabs = document.querySelector('.tabs'); if (!tabs) return;
  const drop = document.createElement('span'); drop.className = 'tab-drop'; drop.setAttribute('aria-hidden', 'true');
  tabs.prepend(drop);
  let cur = null, anim = null, shown = false;
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  const put = g => { drop.style.top = g.y + 'px'; drop.style.height = g.h + 'px'; drop.style.width = g.w + 'px'; drop.style.transform = 'translateX(' + g.x + 'px)'; };
  window.moveTabDrop = function (animate) {
    const t = tabs.querySelector('.tab.active');
    if (!t) { drop.style.opacity = '0'; shown = false; return; }
    const g = { x: t.offsetLeft, w: t.offsetWidth, y: t.offsetTop, h: t.offsetHeight };
    if (anim) { anim.cancel(); anim = null; }
    const from = cur;
    put(g); cur = g;
    if (!shown) { drop.style.opacity = '1'; shown = true; return; }
    if (!animate || !from || reduced() || (from.x === g.x && from.w === g.w)) return;
    const x0 = Math.min(from.x, g.x), x1 = Math.max(from.x + from.w, g.x + g.w);
    const dur = 560;
    anim = drop.animate([
      { transform: 'translateX(' + from.x + 'px)', width: from.w + 'px', offset: 0 },
      { transform: 'translateX(' + x0 + 'px)', width: (x1 - x0) + 'px', offset: .42, easing: 'cubic-bezier(.25,1,.35,1)' },
      { transform: 'translateX(' + g.x + 'px)', width: g.w + 'px', offset: 1 }
    ], { duration: dur, easing: 'cubic-bezier(.45,0,.2,1)' });
    anim.onfinish = anim.oncancel = () => { anim = null; };
  };
  moveTabDrop(false);
  if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) { const t = tabs.querySelector('.tab.active'); if (t) { shown = true; put(cur = { x: t.offsetLeft, w: t.offsetWidth, y: t.offsetTop, h: t.offsetHeight }); } } }).observe(tabs);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveTabDrop(false));
})();

/* ================= CLICK AWAY =================
   Any popover or box that can be open registers here: { els: [elements that count as "inside"], isOpen(), close() }.
   A press anywhere outside those elements closes it. In the project, the Analytics and Activity-log dropdowns register the same way. */
window.ClickAway = (function () {
  const uis = [];
  document.addEventListener('pointerdown', e => {
    uis.forEach(u => {
      try {
        const els = typeof u.els === 'function' ? u.els() : u.els;
        if (u.isOpen() && !els.some(el => el && el.contains(e.target))) u.close();
      } catch (_) {}
    });
  }, true);
  return { register: u => uis.push(u) };
})();

/* ================= NOTCH ================= */
(function () {
  const IDLE_MS = 3000, NEAR_PX = 90, LEAVE_MS = 900, SLIDE_MS = 5000, TZ = 'Africa/Lagos';
  const EX1 = '2026-11-27', EX2 = '2026-11-28';
  const tabs = document.querySelector('.tabs');
  const sheen = document.createElement('div'); sheen.className = 'nt-sheen'; sheen.setAttribute('aria-hidden', 'true'); tabs.appendChild(sheen);
  const inner = document.createElement('div'); inner.className = 'nt-inner';
  const row = document.createElement('div'); row.className = 'nt-row';
  inner.appendChild(row); tabs.appendChild(inner);
  tabs.querySelectorAll('.tab').forEach((t, i) => t.style.setProperty('--i', i));   // stagger order for the unfold

  /* --- slide data --- */
  const ymd = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const tf = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  const wdF = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'long' });
  const dmF = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'long' });
  const dayLbl = s => new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric' }).format(new Date(utc(s)));
  const part = (ps, t) => (ps.find(p => p.type === t) || {}).value || '';

  /* building blocks: a big gold numeral, a hairline rule, and a two-line stack (tracked CAPS label over a quiet line) */
  const rule = '<i class="nt-rule"></i>';
  const num = (n, small) => '<span class="nt-num">' + n + (small ? '<small>' + small + '</small>' : '') + '</span>';
  const stack = (cap, line, live) => '<span class="nt-stack"><span class="nt-cap">' + (live ? '<i class="nt-live"></i>' : '') + cap + '</span><span class="nt-line">' + line + '</span></span>';
  const svg = (inner, w) => '<svg viewBox="0 0 24 24" width="' + (w || 22) + '" height="' + (w || 22) + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  const CLOUD = '<path d="M7 16a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 7.5a4.2 4.2 0 0 1 .5 8.5H7z"/>';
  const ICON = {
    sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
    part:  '<circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2.5v1.5M2.5 8.5H4M4.4 4.4l1 1M12.6 4.4l-1 1"/><path d="M10 20a3.5 3.5 0 0 1-.4-7A4.8 4.8 0 0 1 19 13.2a3.4 3.4 0 0 1 .2 6.8H10z"/>',
    cloud: '<path d="M7 19a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 10.5a4.2 4.2 0 0 1 .5 8.5H7z"/>',
    fog:   '<path d="M4 9h16M3 13h18M6 17h12"/>',
    rain:  CLOUD + '<path d="M8.5 19l-1 2M12.5 19l-1 2M16.5 19l-1 2"/>',
    storm: CLOUD + '<path d="M12.8 14.5l-2.3 3.5h3l-2.3 3.5"/>'
  };
  const wmo = c => svg(ICON[c === 0 ? 'sun' : c <= 2 ? 'part' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : c >= 95 ? 'storm' : 'rain']);
  const DROP = '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" aria-hidden="true"><path d="M12 2.5c3.2 4 6 7.3 6 11a6 6 0 0 1-12 0c0-3.7 2.8-7 6-11z"/></svg>';

  function countdown() {
    const t = utc(ymd()), d1 = (utc(EX1) - t) / 864e5, d2 = (utc(EX2) - t) / 864e5;
    if (d1 > 1)  return num(d1) + rule + stack('Days to exam', 'Fri 27 – Sat 28 November');
    if (d1 === 1) return '<span class="nt-num word">Tomorrow</span>' + rule + stack('Exam begins', 'Friday 27 November');
    if (d1 === 0) return num(1, '/2') + rule + stack('Exam day', 'Today · Day 2 is tomorrow', true);
    if (d2 === 0) return num(2, '/2') + rule + stack('Exam day', 'Today · final day', true);
    return '<span class="nt-done">' + svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 15) + '</span>' + rule + stack('Exam complete', '27 – 28 November');
  }
  let wx = null;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=7.38&longitude=3.95&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Africa%2FLagos&forecast_days=16')
    .then(r => r.json()).then(j => {
      const o = {}; j.daily.time.forEach((d, i) => o[d] = { c: j.daily.weather_code[i], hi: Math.round(j.daily.temperature_2m_max[i]), lo: Math.round(j.daily.temperature_2m_min[i]), p: j.daily.precipitation_probability_max[i] });
      if (o[EX1] || o[EX2]) wx = o;
    }).catch(() => {});

  const slides = [
    () => countdown(),
    () => {
      const now = new Date(), p = tf.formatToParts(now);
      return '<span class="nt-clock"><span class="nt-num" id="ntHM">' + part(p, 'hour') + ':' + part(p, 'minute') + '</span>' +
        '<span class="nt-ss"><span class="nt-ampm" id="ntAP">' + part(p, 'dayPeriod') + '</span><span class="nt-sec" id="ntS">' + part(p, 'second') + '</span></span></span>' +
        rule + stack(wdF.format(now), dmF.format(now));
    },
    () => {
      if (!wx) return null;
      const d = k => { const w = wx[k]; if (!w) return ''; return '<span class="nt-day"><span class="nt-wi">' + wmo(w.c) + '</span><span class="nt-stack"><span class="nt-cap">' + dayLbl(k) + '</span><span class="nt-line"><b class="nt-deg">' + w.hi + '°</b><span class="nt-lo">' + w.lo + '°</span><span class="nt-rain">' + DROP + w.p + '%</span></span></span></span>'; };
      return stack('Ibadan', 'Exam forecast') + rule + d(EX1) + rule + d(EX2);
    }
  ];

  /* --- sizing: only width ever changes, the height stays exactly the tab bar's --- */
  let fullW = 0, idx = 0, slideT = null, notchW = 0;
  const idle = () => tabs.classList.contains('idle');
  function measureFull() { if (!idle()) fullW = tabs.offsetWidth; }
  /* Clock slide: size the hour:minute numerals so their ink is exactly as tall as the AM + seconds stack, and line the two up top and bottom.
     Measured from real glyph ink (canvas metrics + the element's text rect), so it holds for any font size or if the font falls back. */
  const cv = document.createElement('canvas').getContext('2d');
  function fitClock() {
    const hm = document.getElementById('ntHM'), ap = document.getElementById('ntAP'), sc = document.getElementById('ntS');
    if (!hm || !ap || !sc) return;
    const ss = ap.parentNode, k = (inner.getBoundingClientRect().width / inner.offsetWidth) || 1;   // the notch scales while it fades in
    const ink = (el, txt) => {
      const cs = getComputedStyle(el); cv.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      const m = cv.measureText(txt); if (m.fontBoundingBoxAscent == null) return null;
      const r = document.createRange(); r.selectNodeContents(el);
      const base = r.getBoundingClientRect().top + m.fontBoundingBoxAscent * k;
      return { top: base - m.actualBoundingBoxAscent * k, bot: base + m.actualBoundingBoxDescent * k, asc: m.actualBoundingBoxAscent };
    };
    ss.style.transform = ''; hm.style.fontSize = '';
    let a = ink(ap, ap.textContent), c = ink(sc, '0'), h = ink(hm, 'H');
    if (!a || !c || !h) return;
    const target = (c.bot - a.top) / k;                          // AM top to seconds baseline, in CSS px
    hm.style.fontSize = (parseFloat(getComputedStyle(hm).fontSize) * target / h.asc) + 'px';
    a = ink(ap, ap.textContent); c = ink(sc, '0'); h = ink(hm, 'H');
    ss.style.transform = 'translateY(' + ((((h.top + h.bot) - (a.top + c.bot)) / 2) / k) + 'px)';   // centre the stack on the numerals
  }
  function render(animate) {
    let s = null, tries = 0;
    while (!s && tries++ < slides.length) { s = slides[idx % slides.length](); if (!s) idx++; }
    const paint = () => {
      row.innerHTML = s; fitClock();
      notchW = Math.ceil(row.offsetWidth) + 56;
      if (idle()) tabs.style.width = notchW + 'px';
    };
    if (!animate) { paint(); return; }
    inner.classList.add('swap');
    setTimeout(() => { paint(); inner.classList.remove('swap'); }, 160);
  }
  setInterval(() => {
    const a = document.getElementById('ntHM'); if (!a) return;
    const p = tf.formatToParts(new Date());
    a.textContent = part(p, 'hour') + ':' + part(p, 'minute');
    document.getElementById('ntS').textContent = part(p, 'second');
    document.getElementById('ntAP').textContent = part(p, 'dayPeriod');
  }, 1000);

  /* --- idle <-> awake --- */
  let idleT, leaveT = null, morphT;
  function collapse() {
    if (idle()) return;
    if (document.getElementById('anBtn').getAttribute('aria-expanded') === 'true' || tabs.contains(document.activeElement)) return;
    measureFull();
    tabs.style.width = fullW + 'px'; void tabs.offsetWidth;   // pin the start so the width can transition
    clearTimeout(morphT);
    tabs.classList.add('idle'); idx = 0; render(false);
    tabs.style.width = notchW + 'px';
    clearInterval(slideT);
    slideT = setInterval(() => { if (!document.hidden) { idx++; render(true); } }, SLIDE_MS);
  }
  function wake(instant) {
    if (!idle()) return;
    clearInterval(slideT);
    if (instant) { tabs.classList.add('snap'); setTimeout(() => tabs.classList.remove('snap'), 60); }
    tabs.classList.add('morph'); tabs.classList.remove('idle');
    tabs.style.width = fullW + 'px';
    clearTimeout(morphT);
    morphT = setTimeout(() => { tabs.classList.remove('morph'); tabs.style.width = ''; }, 760);   // unfold + the last tab's fade
  }
  const near = (x, y) => {
    const r = tabs.getBoundingClientRect();
    return Math.hypot(Math.max(r.left - x, 0, x - r.right), Math.max(r.top - y, 0, y - r.bottom)) <= NEAR_PX;
  };
  const arm = ms => { clearTimeout(idleT); idleT = setTimeout(collapse, ms); };

  document.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    if (near(e.clientX, e.clientY)) { clearTimeout(leaveT); leaveT = null; clearTimeout(idleT); wake(); }
    else if (!idle() && !leaveT) leaveT = setTimeout(() => { leaveT = null; collapse(); }, LEAVE_MS);
  });
  tabs.addEventListener('pointerdown', () => { wake(); if (!idle()) arm(IDLE_MS + 3000); });
  tabs.addEventListener('focusin', () => { clearTimeout(idleT); wake(true); });
  tabs.addEventListener('focusout', () => arm(LEAVE_MS));
  window.addEventListener('resize', measureFull);

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { measureFull(); arm(IDLE_MS); });
})();

function footerHTML(crest) {
  const c = FOOTER_CONFIG;
  const pretty = c.helpPhone.replace(/^(\d{4})(\d{3})(\d{4})$/, '$1 $2 $3');
  const intl = '+' + c.whatsapp;
  const rows = [
    '<div class="row"><span class="ic">📞</span><div><a class="phone" href="tel:' + intl + '">' + pretty + '</a><div class="small">Call or SMS: works without internet</div></div></div>',
    '<div class="row"><span class="ic">💬</span><div><a href="https://wa.me/' + c.whatsapp + '" target="_blank" rel="noopener">Chat on WhatsApp</a><div class="small">Needs an internet connection</div></div></div>'
  ];
  if (c.email)   rows.push('<div class="row"><span class="ic">✉️</span><a href="mailto:' + c.email + '">' + c.email + '</a></div>');
  if (c.hours)   rows.push('<div class="row"><span class="ic">🕘</span><span>' + c.hours + '</span></div>');
  if (c.address) rows.push('<div class="row"><span class="ic">📍</span><span>' + c.address + '</span></div>');
  const SOC_HOME = { email: 'https://mail.google.com/', whatsapp: 'https://wa.me/' + c.whatsapp, x: 'https://x.com/', github: 'https://github.com/', linkedin: 'https://linkedin.com/', };
  const social = (c.social || []).filter(s => SOCIAL_ICONS[s.k]).map(s => {
    const url = s.url || (s.k === 'email' && c.email ? 'mailto:' + c.email : SOC_HOME[s.k]);
    const ic = SOCIAL_ICONS[s.k];
    return '<li><a href="' + url + '" target="_blank" rel="noopener" aria-label="' + s.label + '" title="' + s.label + '"><svg viewBox="' + ic[0] + '" aria-hidden="true" focusable="false"><path d="' + ic[1] + '"/></svg></a></li>';
  }).join('');
  return `

// Make the "Slips are issued…" note sit level with the "Have your full name…" note by letting the station box grow
function alignNotes(d) {
  try {
    const st = d.getElementById('ftStatus'), a = d.getElementById('ftNoteS'), h = d.getElementById('ftNoteH'), main = d.querySelector('#slipFooter .ft-main');
    if (!st || !a || !h || !main) return;
    st.style.minHeight = ''; h.style.marginTop = '10px';
    if (d.defaultView.getComputedStyle(main).gridTemplateColumns.split(' ').length < 4) return;   // stacked on narrow screens
    const diff = Math.round(h.getBoundingClientRect().top - a.getBoundingClientRect().top);   // >0: help desk note is lower, so the box grows; <0: the box is already taller, so the help note moves down
    if (diff > 0) st.style.minHeight = (st.offsetHeight + diff) + 'px';
    else if (diff < 0) h.style.marginTop = (10 - diff) + 'px';
  } catch (e) {}
}

    else if (has) { recs.textContent = ROWS.length.toLocaleString() + ' applications'; meta.textContent = 'Loaded ' + (LOADED_AT || ''); act.textContent = '⟳'; }

}

        zone = f.querySelector('#ftZone'), upT = f.querySelector('#ftUpT'), upS = f.querySelector('#ftUpS'), upAskP = f.querySelector('#ftUpAskP'),
        upNo = f.querySelector('#ftUpNo'), upYes = f.querySelector('#ftUpYes');

  function takeFile(file) {                       // a file dropped on the box

  window.slipRegister.error = text => { if (!upFrom) return; openUp(false); upErr(text); };

  zone.addEventListener('click', pickFile);

  f.querySelector('#ftUpX').addEventListener('click', () => closeUp(true));
  upNo.addEventListener('click', () => { upPending = null; stBox.classList.remove('replacing'); zone.focus({ preventScroll: true }); });

  f.addEventListener('click', e => {
    const t = e.target.closest('[data-top]'); if (t) window.scrollTo({ top: 0, behavior: 'smooth' });
    const closeBox = () => { stBox.classList.remove('asking', 'done'); mnEl.inert = false; cfEl.inert = true; };

  window.addEventListener('online', () => setFooterStatus(document)); window.addEventListener('offline', () => setFooterStatus(document));
  window.ClickAway.register({
    els: () => [stBox],
    isOpen: () => stBox.classList.contains('asking') || stBox.classList.contains('picking'),
    close: () => resetBox()
  });
  setFooterStatus(document);
  const mainEl = f.querySelector('.ft-main');
  if (window.ResizeObserver) { let q = 0; new ResizeObserver(() => { if (q) return; q = requestAnimationFrame(() => { q = 0; alignNotes(document); }); }).observe(mainEl); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignNotes(document));
})();

<script>
/* ================= UPLOAD PANEL =================
   The Load register button opens this panel instead of going straight to the file picker. */
(function () {
  const lb = document.getElementById('loadBtn'), inp = document.getElementById('xlsxFile');
  if (!lb || !inp || !window.slipRegister) return;
  const dim = document.createElement('div'); dim.className = 'navdim'; dim.setAttribute('aria-hidden', 'true'); document.body.appendChild(dim);   // same page dim as the other navbar dropdowns (css/01-base.css; the project's sync.js does this)
  const OK = /\.(xlsx|xls|csv)$/i, DEMO_N = 0;
  const lbIco = lb.querySelector('.lb-ico'), lbMain = lb.querySelector('.lb-main'), lbProg = lb.querySelector('.lb-prog');
  const SHEET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  const p = document.createElement('div');
  p.id = 'upPanel'; p.className = 'uppop'; p.hidden = true; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Load register'); p.inert = true;
  p.innerHTML =
    '<div class="up-head"><b>Load register</b><small>.xlsx, .xls or .csv</small></div>' +
    '<div class="up-zone" role="button" tabindex="0" aria-label="Choose a register file, or drop one here">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>' +
      '<b class="up-t"></b><span class="up-s"></span></div>' +
    '<div class="up-file"><span class="up-fi">' + SHEET + '</span><div class="up-fm">' +
      '<div class="up-fn"><span class="up-name"></span><em class="up-pct">0%</em></div>' +
      '<div class="up-fs" aria-live="polite"></div><div class="up-bar"><i></i></div></div></div>' +
    '<div class="up-ask" role="alertdialog" aria-label="Replace the loaded register?"><b>Replace the loaded register?</b><p class="up-askp"></p>' +
      '<div class="up-btns"><button type="button" class="up-no">Cancel</button><button type="button" class="up-yes">Replace</button></div></div>' +
    '<p class="up-msg" role="alert"></p>';
  const head = p.querySelector('.up-head'); head.innerHTML = '<b>Load register</b><span>.xlsx, .xls or .csv</span>';
  const bodyEl = document.createElement('div'); bodyEl.className = 'up-body';
  Array.prototype.slice.call(p.children).forEach(c => { if (c !== head) bodyEl.appendChild(c); }); p.appendChild(bodyEl);
  lb.parentNode.appendChild(p);
  const $ = s => p.querySelector(s);
  const zone = $('.up-zone'), zt = $('.up-t'), zs = $('.up-s'), msg = $('.up-msg'), nameEl = $('.up-name'), pctEl = $('.up-pct'),
        fs = $('.up-fs'), bar = $('.up-bar i'), askP = $('.up-askp'), noBtn = $('.up-no'), yesBtn = $('.up-yes');

  let isOpen = false, byDrag = false, busy = false, pending = null, errT = 0, runId = 0, prev = null;
  const count = () => window.slipRegister.count();
  const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

  /* keyboard access to the button (the file input behind it stays out of the tab order) */
  lb.tabIndex = 0; lb.setAttribute('role', 'button'); inp.tabIndex = -1;
  lb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

  function paintIdle() {
    const n = count();
    zt.textContent = p.classList.contains('is-drag') ? 'Release to load' : p.classList.contains('is-hint') ? 'Drop the file here' : n ? 'Drop a new register here' : 'Drop the register here';
    zs.textContent = n ? n.toLocaleString() + ' records loaded · or click to browse' : 'or click to browse';
  }
  function place() {
    const r = lb.getBoundingClientRect(), w = p.offsetWidth;
    let left = 12;
    if (innerWidth > 860) {
      const host = p.offsetParent ? p.offsetParent.getBoundingClientRect().left : 0;
      const vl = Math.max(12, Math.min(r.right - w, innerWidth - w - 12));
      p.style.left = (vl - host) + 'px'; left = vl;
    } else p.style.left = '';

  }
  function open(viaDrag) {
    if (isOpen) return;
    isOpen = true; byDrag = !!viaDrag; p.hidden = false; place(); paintIdle();
    p.inert = false; lb.setAttribute('aria-expanded', 'true'); document.body.classList.add('nav-dd-open');
    if (!viaDrag && !busy) setTimeout(() => { if (isOpen && !p.classList.contains('is-ask')) zone.focus({ preventScroll: true }); }, 60);
  }
  function close(restoreFocus) {
    if (!isOpen) return;
    isOpen = false; byDrag = false; pending = null;
    p.hidden = true; p.classList.remove('is-drag', 'is-hint', 'is-ask'); clearErr(); p.inert = true; lb.setAttribute('aria-expanded', 'false'); document.body.classList.remove('nav-dd-open');
    if (restoreFocus) lb.focus({ preventScroll: true });
  }
  const toggle = () => isOpen ? close() : open();

  /* the button opens the panel; only the zone opens the picker */
  lb.addEventListener('click', e => { if (e.target === inp) return; e.preventDefault(); toggle(); });
  const browse = () => { if (busy) return; inp.value = ''; inp.click(); };
  zone.addEventListener('click', browse);
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); browse(); } });
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; if (f) accept(f, false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) close(true); });
  addEventListener('resize', () => { if (isOpen) place(); });
  addEventListener('scroll', () => { if (isOpen) place(); }, { passive: true });
  window.ClickAway.register({ els: () => [p, lb], isOpen: () => isOpen, close: () => close() });

  function showErr(text) {
    if (window.slipRegister.error) window.slipRegister.error(text);   // footer-started loads show the problem in the footer
    clearTimeout(errT); p.classList.remove('is-err'); void p.offsetWidth; p.classList.add('is-err'); msg.textContent = text;
    errT = setTimeout(clearErr, 4500);
  }
  window.sdUpload = { pick: browse, load: f => accept(f, false) };   // the footer's upload area uses the same picker and reader (real app: SD.pick / loadRegisterFile)
  function clearErr() { clearTimeout(errT); p.classList.remove('is-err'); msg.textContent = ''; }

  function accept(file, dropped) {
    if (busy) { showErr('A register is still loading. Please wait.'); return; }
    if (!OK.test(file.name)) { showErr('“' + file.name + '” is not a register file. Use .xlsx, .xls or .csv.'); return; }
    if (dropped && count()) {                                     // replacing something that is already loaded: ask first
      pending = file; clearErr();
      askP.textContent = 'Loading “' + file.name + '” clears the ' + count().toLocaleString() + ' applications already on this desk.';
      p.classList.add('is-ask'); setTimeout(() => noBtn.focus({ preventScroll: true }), 60);

    start(file);
  }
  noBtn.addEventListener('click', () => { pending = null; p.classList.remove('is-ask'); zone.focus({ preventScroll: true }); });
  yesBtn.addEventListener('click', () => { const f = pending; pending = null; p.classList.remove('is-ask'); if (f) start(f); });

  function setProg(pr, label) {
    const pc = Math.round(pr * 100);
    bar.style.setProperty('--p', pr); pctEl.textContent = pc + '%'; fs.textContent = label;
    lb.style.setProperty('--lbp', pr); if (lbProg) lbProg.style.transform = 'scaleX(' + pr + ')'; lbMain.textContent = 'Reading… ' + pc + '%';
  }
  function start(file) {
    busy = true; const id = ++runId; clearErr(); byDrag = false;
    prev = { state: lb.dataset.state, ico: lbIco.textContent, html: lbMain.innerHTML };
    nameEl.textContent = file.name; nameEl.title = file.name;
    p.classList.add('is-load');
    lb.dataset.state = 'loading'; lbIco.textContent = '⏳';
    window.slipRegister.busy(file.name);

    const tm = setInterval(() => { pr += (0.92 - pr) * 0.07; setProg(pr, fmtSize(file.size) + ' · reading…'); }, 60);
    window.attendanceLoad(file, {
      done: n => { clearInterval(tm); if (id === runId) finish(n, file); },
      fail: m => { clearInterval(tm); if (id === runId) fail(m); }
    });
  }
  function finish(n, file) {
    if (!n) return fail('No records found in “' + file.name + '”.');
    busy = false; window.slipRegister.set(n);
    setProg(1, fmtSize(file.size) + ' · ' + n.toLocaleString() + ' records');
    syncNav();
    const id = runId;
    setTimeout(() => { if (id === runId) { close(); p.classList.remove('is-load'); } }, 900);
  }
  function fail(text) {
    busy = false; p.classList.remove('is-load'); lb.style.removeProperty('--lbp'); if (lbProg) lbProg.style.transform = '';
    window.slipRegister.busy('');                                  // footer back to what it was
    if (prev) { lb.dataset.state = prev.state; lbIco.textContent = prev.ico; lbMain.innerHTML = prev.html; }
    paintIdle(); showErr(text);
  }
  function syncNav() {                                             // navbar button follows the register (also after Disconnect in the footer)
    if (busy) return;
    const n = count();
    lb.style.removeProperty('--lbp'); if (lbProg) lbProg.style.transform = '';
    lb.dataset.state = n ? 'loaded' : 'empty';
    lbIco.textContent = n ? '✓' : '📂';
    lbMain.innerHTML = n ? '<span class="lb-num">' + n.toLocaleString() + '</span> <span class="lb-word">Records</span>' : 'Load register';
    if (!p.classList.contains('is-load')) paintIdle();

  /* dragging a file over the page opens the panel; dropping anywhere but the panel or the button does nothing */
  let dc = 0;
  const hasFiles = e => !!(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0);
  const overTarget = e => p.contains(e.target) || lb.contains(e.target);
  function endDrag() { dc = 0; document.body.classList.remove('up-drag'); p.classList.remove('is-drag', 'is-hint'); paintIdle(); }
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; dc++; if (e.target.closest && e.target.closest('#ftStatus')) return; if (!isOpen) open(true); if (!p.classList.contains('is-load')) { p.classList.add('is-hint'); paintIdle(); } });
  addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    document.body.classList.add('up-drag');          // the dim lets the drag through, so the footer drop box under it still works
    if (e.defaultPrevented) { if (byDrag && isOpen) close(); return; }   // over the footer's own drop box: it takes the file

  });

  addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    if (e.defaultPrevented) { const was = byDrag; endDrag(); if (was) close(); return; }   // the footer box handled it

    const over = overTarget(e), f = e.dataTransfer.files && e.dataTransfer.files[0], was = byDrag;
    endDrag();
    if (over && f) { if (!isOpen) open(true); byDrag = false; accept(f, true); }
    else if (was) close();
  });
})();

/* account menu on the user chip (11-profile.css). Profile and Sign out tell the app through events */
(function(){

  so.addEventListener('click', () => on ? closeM() : openM());
